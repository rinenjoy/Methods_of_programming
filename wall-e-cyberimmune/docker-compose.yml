services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.0
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - walle_network

  broker:
    image: confluentinc/cp-kafka:7.2.0
    container_name: broker
    ports:
      - "9092:9092"
    expose:
      - "29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - walle_network

  # === Физический имитатор робота (как cars/ в примере хакатона) ===
  wall-e:
    build: ./wall-e
    image: wall-e
    container_name: wall-e
    ports:
      - "8000:8000"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator-tasks:6101
    networks:
      - walle_network

  # === Клиент оператора ===
  operator:
    build: ./operator
    image: operator
    container_name: operator
    ports:
      - "7000:7000"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator-tasks:6101
    depends_on:
      - orchestrator-tasks
    networks:
      - walle_network


  monitor:
    build: ./management-system/modules/monitor
    image: monitor
    entrypoint:
      - bash
      - -c
      - |
        echo 'Giving Kafka a bit of time to start up…'
        sleep 25
        venv/bin/python start.py /shared/config.ini --reset
    container_name: monitor
    environment:
      - MODULE_NAME=monitor
    volumes:
      - ./management-system/shared:/shared
    depends_on:
      - broker
    networks:
      - walle_network

  orchestrator-tasks:
    build: ./management-system/modules/orchestrator-tasks
    image: orchestrator-tasks
    entrypoint:
      - bash
      - -c
      - |
        echo 'Giving Kafka a bit of time to start up…'
        sleep 25
        venv/bin/python start.py /shared/config.ini --reset
    container_name: orchestrator-tasks
    environment:
      - MODULE_NAME=orchestrator-tasks
      - MODULE_PORT=6101
    volumes:
      - ./management-system/shared:/shared
    depends_on:
      - broker
      - monitor
    ports:
      - 6101:6101
    networks:
      - walle_network

  data-channel:
